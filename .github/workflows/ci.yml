name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript and Svelte
        run: npm run typecheck

      - name: Run ordinary MCP client and affected integration checks
        run: npm run test:mcp

      - name: Build production application
        run: npm run build
      - name: Check rendered MCP controls with an installed headless browser
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          export MCP_UI_REPORT="$RUNNER_TEMP/agent-mcp-ui.json"
          node scripts/test-agent-mcp-ui.mjs

  agent-mcp-windows-native:
    name: Windows native MCP process lifecycle
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify actual owned stdio process and descendant cleanup
        run: npm test -- src/main/services/agentMcpWindowsNative.test.ts

  skills-windows-readonly:
    name: Windows ordinary skill reads
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Ordinary read-only files only; no legacy assessment files or writer fixtures.
      - name: Read-only skill workflow and production capability
        run: npm test -- src/main/services/agentSkillsWorkflow.integration.test.ts src/main/services/agentSkillSaveSupport.test.ts
      - name: Portable skill discovery, resources, and Windows aliases
        run: npm test -- src/main/services/agentSkillStore.test.ts --testNamePattern "always includes|supports canonical Unicode|reads existing standard|keeps scripts inert|reports size|excludes duplicate|bounds resource bytes|rechecks registered fixture|accepts ordinary Windows case"
